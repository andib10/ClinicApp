<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inregistrare cu succes</title>
</head>
<body>
<p>Draga <span th:text="${firstName}"></span>,</p>
<p>Contul tau a fost creat cu succes!</p>
<ul>
    <li><b>Username:</b> <span th:text="${userName}"></span></li>
    <li><b>Prenume:</b> <span th:text="${firstName}"></span></li>
    <li><b>Nume:</b> <span th:text="${lastName}"></span></li>
    <li><b>Email:</b> <span th:text="${email}"></span></li>
    <li><b>Numar de telefon:</b> <span th:text="${phoneNumber}"></span></li>
    <li><b>Data nasterii:</b> <span th:text="${#dates.format(birthDate, 'yyyy-MM-dd')}"></span></li>
    <li><b>CNP:</b> <span th:text="${CNP}"></span></li>
</ul>
<p>Iti multumim pentru inregistrare!</p>
</body>
</html>
